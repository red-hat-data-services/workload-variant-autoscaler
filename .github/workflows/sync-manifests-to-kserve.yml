name: Sync Manifests to kserve

on:
  pull_request_target:
    branches:
      - 'rhoai-[0-9].[0-9]**'
    types: [closed]
    paths: ['legacy/config/**']
  push:
    branches: [main]
    paths: ['legacy/config/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    name: Sync kustomize manifests to kserve
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event_name == 'pull_request_target' && github.base_ref || github.ref_name }}
    steps:
      - name: Print sync parameters
        run: |
          echo "Source: ${{ github.repository }} @ ${{ env.TARGET_BRANCH }}"
          echo "Target: ${{ github.repository_owner }}/kserve @ ${{ env.TARGET_BRANCH }}"

      - name: Checkout workload-variant-autoscaler
        id: checkout-source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          path: workload-variant-autoscaler

      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RHDS_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.RHDS_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: kserve

      - name: Checkout kserve
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/kserve
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ steps.app-token.outputs.token }}
          path: kserve

      - name: Sync manifests
        run: |
          DEST="kserve/kserve-module/prefetched-manifests-rhoai/wva"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -r workload-variant-autoscaler/legacy/config/. "$DEST/"

      - name: Detect changes
        id: changes
        working-directory: kserve
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No manifest changes detected — skipping PR creation."
          fi

      - name: Push updated manifests to KServe
        if: steps.changes.outputs.changed == 'true'
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          SOURCE_BRANCH: ${{ env.TARGET_BRANCH }}
          SOURCE_SHA: ${{ steps.checkout-source.outputs.commit }}
        working-directory: kserve
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all kserve-module/prefetched-manifests-rhoai/wva/
          git commit -m "chore: sync workload-variant-autoscaler manifests from ${REPO_OWNER}/workload-variant-autoscaler@${SOURCE_SHA:0:8}"
          MAX_RETRIES=5
          for attempt in $(seq 1 $MAX_RETRIES); do
            if git push origin "$SOURCE_BRANCH"; then
              echo "Push of updated manifests succeeded (attempt ${attempt})"
              exit 0
            fi
            echo "Push of updated manifests failed (attempt ${attempt})"
            if [ "$attempt" -lt "$MAX_RETRIES" ]; then
              echo "Rebasing and retrying"
              if ! git pull --rebase origin "$SOURCE_BRANCH"; then
                echo "ERROR: Rebase failed. Aborting." >&2
                exit 1
              fi
            fi
          done
          echo "ERROR: All retries exhausted. Push failed." >&2
          exit 1
      - name: Report notification configuration
        # Make it visible in every run whether failure notifications are
        # armed, and why not if they are not. Env-indirect so the webhook
        # value is never interpolated into the script body.
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.RHOAI_DEVOPS_SLACK_WEBHOOK }}
          SLACK_MENTIONS: ${{ vars.RHOAI_SLACK_MENTIONS }}
        run: |
          armed=true
          if [ -z "$SLACK_WEBHOOK" ]; then
            armed=false
            echo "::warning title=Slack notifications skipped::RHOAI_DEVOPS_SLACK_WEBHOOK secret is not set on this repository; failure notifications will not be posted."
          else
            echo "RHOAI_DEVOPS_SLACK_WEBHOOK is set."
          fi
          if [ -z "$SLACK_MENTIONS" ]; then
            armed=false
            echo "::warning title=Slack notifications skipped::RHOAI_SLACK_MENTIONS variable is not set on this repository; failure notifications will not be posted."
          else
            echo "RHOAI_SLACK_MENTIONS is set."
          fi
          if [ "$armed" = true ]; then
            echo "Slack failure notifications are armed."
          else
            echo "::warning title=Slack notifications skipped::Failure notifications are disabled until both RHOAI_DEVOPS_SLACK_WEBHOOK and RHOAI_SLACK_MENTIONS are configured."
          fi

      - name: Notify on failure
        # Dormant until RHOAI_DEVOPS_SLACK_WEBHOOK (secret) and
        # RHOAI_SLACK_MENTIONS (variable, e.g. '<!subteam^S…>') are set.
        if: >-
          failure() &&
          secrets.RHOAI_DEVOPS_SLACK_WEBHOOK != '' &&
          vars.RHOAI_SLACK_MENTIONS != ''
        uses: rtcamp/action-slack-notify@sha256:17fac87b8ea4ffec1f90b855f7f88e8fd69ec8568f690f4ea24d5a408eeee419a
        env:
          SLACK_WEBHOOK: ${{ secrets.RHOAI_DEVOPS_SLACK_WEBHOOK }}
          SLACK_COLOR: danger
          SLACK_TITLE: Manifest sync to kserve failed (workload-variant-autoscaler)
          SLACK_MENTIONS: ${{ vars.RHOAI_SLACK_MENTIONS }}
          SLACK_MESSAGE: |
            sync-manifests-to-kserve failed on ${{ github.ref_name }}.
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}